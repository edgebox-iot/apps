version: "3"

volumes:
  mongodb_data: { driver: local }

services:
  rocketchat-ws:
    container_name: '${COMPOSE_PROJECT_NAME-edgebox}-rocketchat-ws'
    image: registry.rocket.chat/rocketchat/rocket.chat:${RELEASE:-latest}
    restart: always
    environment:
      VIRTUAL_HOST: ${LOCAL_URL}${INTERNET_URL}
      MONGO_URL: "mongodb://rocketchat-db:27017/\
        rocketchat?replicaSet=rs0"
      MONGO_OPLOG_URL: "mongodb://rocketchat-db:27017/\
        local?replicaSet=rs0"
      ROOT_URL: http://localhost:3000
      PORT: 3000
      DEPLOY_METHOD: docker
    depends_on:
      - rocketchat-db
    expose:
      - 3000
    # ports:
    #   - "${BIND_IP:-0.0.0.0}:${HOST_PORT:-3000}:${PORT:-3000}"

  rocketchat-db:
    image: docker.io/bitnami/mongodb:5.0
    restart: always
    user: root
    volumes:
      - ./appdata/rocketchat-db/mongodb:/bitnami/mongodb:rw
    environment:
      MONGODB_REPLICA_SET_MODE: "primary"
      MONGODB_REPLICA_SET_NAME: "rs0"
      MONGODB_PORT_NUMBER: 27017
      MONGODB_INITIAL_PRIMARY_HOST: "rocketchat-db"
      MONGODB_INITIAL_PRIMARY_PORT_NUMBER: 27017
      MONGODB_ADVERTISED_HOSTNAME: "rocketchat-db"
      MONGODB_ENABLE_JOURNAL: "true"
      ALLOW_EMPTY_PASSWORD: "yes"      
      